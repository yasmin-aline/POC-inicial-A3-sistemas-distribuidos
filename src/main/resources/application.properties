spring.application.name=pix-seguro
server.port=${PORT:8080}

# H2 é o padrão local. Em outro ambiente, configure SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pixseguro;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health

# IA de análise de mensagens. Sem chave, o motor local continua funcionando.
pixseguro.ia.api-key=${GEMINI_API_KEY:}
pixseguro.ia.model=${GEMINI_MODEL:gemini-2.5-flash}
# Simula indisponibilidade do provedor remoto; o motor local permanece disponível.
pixseguro.ia.simular-indisponivel=${PIXSEGURO_IA_OFFLINE:false}

# Cria denúncias de exemplo ao subir (idempotente).
pixseguro.seed-demo=${PIXSEGURO_SEED_DEMO:true}
