spring.application.name=pix-seguro
server.port=${PORT:8080}

# Banco em memoria (PoC). Os dados somem quando a aplicacao reinicia.
spring.datasource.url=jdbc:h2:mem:pixseguro;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# IA de analise de mensagens (opcional). Sem chave, usa o motor de regras local.
pixseguro.ia.api-key=${ANTHROPIC_API_KEY:}
pixseguro.ia.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
# Liga para simular o ramo "IA fora do ar" do fluxograma
pixseguro.ia.simular-indisponivel=${PIXSEGURO_IA_OFFLINE:false}

# Cria algumas denuncias de exemplo ao subir
pixseguro.seed-demo=${PIXSEGURO_SEED_DEMO:true}
